<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nieuwe melding | PICKET</title><link rel="stylesheet" href="./style.css"></head><body>
<h1>Nieuwe melding</h1><p>NKTR PICKET · Personeelsmelding registreren</p>
<div id="connection" class="notice">Verbinding controleren…</div>
<form id="incident" novalidate><div class="grid">
 <div class="field wide"><label for="employee">Naam medewerker *</label><input id="employee" maxlength="80" required autocomplete="off" placeholder="Voor- en achternaam"><small>Vorige meldingen kunnen worden gekoppeld. Alleen PICKET, inclusief archief.</small><div id="matches"></div></div>
 <div class="field"><label for="company">Bedrijf *</label><select id="company" disabled><option>Bedrijven laden…</option></select></div>
 <div class="field"><label for="type">Type melding *</label><select id="type"><option value="">Kies type</option><option>Ziek</option><option>Te laat</option><option>No-show</option><option>Niet beschikbaar</option><option>Ongeval</option><option>Noodgeval</option><option>Overig</option></select></div>
 <div class="field"><label for="date">Datum dienst *</label><input id="date" type="date" required></div>
 <div class="field"><label for="replacement">Vervanging nodig? *</label><select id="replacement"><option value="">Kies Ja of Nee</option><option value="ja">Ja</option><option value="nee">Nee</option></select></div>
 <div class="field"><label>Begin dienst *</label><label><input id="startUnknown" type="checkbox" style="width:auto"> Onbekend</label><div style="display:flex;gap:7px"><select id="startHour" aria-label="Begin uur"></select><select id="startMinute" aria-label="Begin minuten"></select></div></div>
 <div class="field"><label>Einde dienst *</label><label><input id="endUnknown" type="checkbox" style="width:auto"> Onbekend</label><div style="display:flex;gap:7px"><select id="endHour" aria-label="Eind uur"></select><select id="endMinute" aria-label="Eind minuten"></select></div></div>
 <div id="duration" class="notice wide">Dienstduur nog niet beschikbaar.</div>
 <div class="field wide"><label for="explanation">Toelichting (10–250 tekens) *</label><textarea id="explanation" maxlength="250" required placeholder="Wat is er gebeurd?"></textarea><small>Noteer geen diagnose of andere medische details. <span id="count">0/250</span></small></div>
 <div class="field"><label for="phone">Telefoonnummer *</label><label><input type="checkbox" id="phoneUnknown" style="width:auto"> Onbekend</label><input id="phone" type="tel" placeholder="06 12345678"></div>
 <div class="field"><label for="returnDate">Verwachte terugkeer *</label><label><input type="checkbox" id="returnUnknown" style="width:auto"> Onbekend</label><input id="returnDate" type="date"></div>
</div><div class="actions"><button type="button" class="secondary" id="validate">CONTROLEER MELDING</button><button type="submit" id="submit" disabled>MELDING OPSLAAN</button></div><div id="validation" role="status" class="notice"></div></form>
<script src="https://p.trellocdn.com/power-up.min.js"></script><script src="./common.js"></script><script>
(async()=>{
const t=window.TrelloPowerUp.iframe(),$=id=>document.getElementById(id),submissionId=crypto.randomUUID();let connected=false,relatedCardId='',matchTimer;
const currentDate=new Date();$('date').value=[currentDate.getFullYear(),Picket.pad(currentDate.getMonth()+1),Picket.pad(currentDate.getDate())].join('-');
for(const side of ['start','end']){
 const hour=$(side+'Hour'),minute=$(side+'Minute');hour.add(new Option('Uur',''));minute.add(new Option('Min',''));
 for(let i=0;i<24;i++)hour.add(new Option(Picket.pad(i),Picket.pad(i)));for(let i=0;i<60;i++)minute.add(new Option(Picket.pad(i),Picket.pad(i)));
 $(side+'Unknown').addEventListener('change',()=>{hour.disabled=minute.disabled=$(side+'Unknown').checked;if(hour.disabled){hour.value='';minute.value=''}duration()});
 hour.addEventListener('change',duration);minute.addEventListener('change',duration);
}
for(const x of ['phone','return'])$(x+'Unknown').addEventListener('change',()=>{const field=$(x==='phone'?'phone':'returnDate');field.disabled=$(x+'Unknown').checked;if(field.disabled)field.value=''});
$('explanation').addEventListener('input',()=>Picket.text('count',$('explanation').value.length+'/250'));
function times(side){if($(side+'Unknown').checked)return'Onbekend';const h=$(side+'Hour').value,m=$(side+'Minute').value;return h!==''&&m!==''?h+':'+m:null}
function duration(){const a=times('start'),b=times('end');if(!a||!b){Picket.text('duration','Vul begin- en eindtijd in, of kies Onbekend.');return}if(a==='Onbekend'||b==='Onbekend'){Picket.text('duration','Dienstduur onbekend.');return}const n=(Number(b.slice(0,2))*60+Number(b.slice(3))-Number(a.slice(0,2))*60-Number(a.slice(3))+1440)%1440;Picket.text('duration',n?Math.floor(n/60)+' uur '+Picket.pad(n%60)+' min'+(b<a?' · eindigt volgende dag':''):'Begin- en eindtijd mogen niet gelijk zijn.')}
function form(){return {submissionId,employee:$('employee').value.trim(),relatedCardId,company:$('company').value,type:$('type').value,date:$('date').value,replacement:$('replacement').value,start:times('start')||'',end:times('end')||'',explanation:$('explanation').value.trim(),phone:$('phoneUnknown').checked?'Onbekend':$('phone').value.trim(),returnDate:$('returnUnknown').checked?'Onbekend':$('returnDate').value}}
function validate(){const x=form(),errors=[];if(x.employee.length<2)errors.push('Naam medewerker ontbreekt');if(!x.company)errors.push('Bedrijf ontbreekt');if(!x.type)errors.push('Type melding ontbreekt');if(!x.date)errors.push('Datum ontbreekt');if(!x.replacement)errors.push('Vervanging kiezen');if(!x.start||!x.end||x.start===x.end)errors.push('Diensttijden ongeldig');if(x.explanation.length<10||x.explanation.length>250)errors.push('Toelichting 10–250 tekens');if(!x.phone)errors.push('Telefoonnummer of Onbekend');if(!x.returnDate)errors.push('Terugkeerdatum of Onbekend');$('validation').className='notice '+(errors.length?'error':'success');Picket.text('validation',errors.length?errors.join(' · '):'Klaar om te registreren.');return errors.length===0}
$('validate').addEventListener('click',validate);
$('employee').addEventListener('input',()=>{relatedCardId='';clearTimeout(matchTimer);$('matches').replaceChildren();if($('employee').value.trim().length<3||!connected)return;matchTimer=setTimeout(async()=>{try{const x=await Picket.call(t,'/api/matches','picket-matches',{employee:$('employee').value});for(const m of x.matches||[]){const btn=Picket.node('button',m.name+(m.archived?' · archief':' · actief'),'secondary');btn.type='button';btn.addEventListener('click',()=>{$('employee').value=m.name;relatedCardId=m.id;$('matches').replaceChildren(Picket.node('small','Gekoppeld aan eerdere melding'))});$('matches').append(btn)}}catch{Picket.text('matches','Naamcontrole niet beschikbaar')}},650)});
$('incident').addEventListener('submit',async(e)=>{e.preventDefault();if(!connected||!validate())return;$('submit').disabled=true;Picket.text('validation','Melding opslaan…');try{const res=await Picket.call(t,'/api/submit','picket-submit',form());Picket.text('validation','Melding opgeslagen: '+res.status);$('validation').className='notice success';$('validate').disabled=true;await t.alert({message:'Melding geregistreerd'});await t.closeModal()}catch(err){Picket.text('validation','Niet bevestigd: '+err.message+' Controleer het bord vóór opnieuw proberen.');$('validation').className='notice error';$('submit').disabled=false}});
try{const r=await Picket.call(t,'/api/bootstrap','picket-bootstrap');$('company').replaceChildren(new Option('Kies bedrijf',''));for(const n of r.companies||[])$('company').add(new Option(n,n));if(!(r.companies||[]).length)throw Error('Geen actieve bedrijven');$('company').disabled=false;connected=true;$('submit').disabled=false;Picket.text('connection',r.sync?.issues?.length?'Verbonden · Controleer bedrijfssynchronisatie: '+r.sync.issues.join('; '):'PICKET verbonden · Actieve bedrijven geladen')}catch(err){Picket.text('connection','Niet verbonden: '+err.message)}duration();
})();
</script></body></html>
