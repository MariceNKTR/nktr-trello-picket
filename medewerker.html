<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICKET | Medewerker toevoegen</title><link rel="stylesheet" href="./style.css"></head><body>
<h1>Medewerker toevoegen</h1><p>Maak een PICKET medewerkerkaart zonder melding aan te maken.</p><div id="connection" class="notice">Verbinding controleren…</div>
<form id="employeeForm" novalidate><div class="field"><label for="employee">Naam medewerker *</label><input id="employee" maxlength="80" autocomplete="off" required placeholder="Voor- en achternaam"><small id="identityStatus">Zoeken in Onboarding, inclusief archief.</small><div id="onbMatches" class="match-list"></div></div>
<div class="field"><label for="company">Bedrijf (optioneel)</label><select id="company" disabled><option>Bedrijven laden…</option></select><small>Geen bedrijf? Kaart verschijnt in MELDINGEN | OPEN met BEDRIJF KIEZEN.</small></div>
<div class="actions"><button id="submit" type="submit" disabled>MEDEWERKER OPSLAAN</button></div><div id="message" class="notice" role="status"></div></form>
<script src="https://p.trellocdn.com/power-up.min.js"></script><script src="./common.js"></script><script>
(async()=>{const t=TrelloPowerUp.iframe(),$=id=>document.getElementById(id),submissionId=crypto.randomUUID();let ready=false;const picker=Picket.employeePicker(t,$('employee'),$('onbMatches'),$('identityStatus'));
try{const x=await Picket.call(t,'/api/bootstrap','picket-bootstrap');$('company').replaceChildren(new Option('Bedrijf nog niet kiezen',''));for(const c of x.companies||[])$('company').add(new Option(c,c));$('company').disabled=false;$('submit').disabled=false;ready=true;Picket.text('connection','PICKET verbonden')}catch(e){Picket.text('connection','Geen verbinding: '+e.message)}
$('employeeForm').addEventListener('submit',async e=>{e.preventDefault();if(!ready)return;const name=$('employee').value.trim();if(name.length<2){Picket.text('message','Vul een medewerkernaam in.');return}$('submit').disabled=true;try{const result=await Picket.call(t,'/api/employee-card','picket-employee-card',{submissionId,employee:name,onbEmployeeId:picker.selectedId(),relatedCardId:picker.relatedId(),company:$('company').value});Picket.text('message','Kaart opgeslagen: '+result.status);await t.alert({message:'Medewerkerkaart aangemaakt'});await t.closeModal()}catch(error){Picket.text('message','Niet bevestigd: '+error.message+' Controleer eerst het bord.');$('submit').disabled=false}});
})();
</script></body></html>
